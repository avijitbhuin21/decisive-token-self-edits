[project]
name = "selfedit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "mlx-lm>=0.32.2; sys_platform == 'darwin'",
    "torch; sys_platform != 'darwin'",
    "transformers; sys_platform != 'darwin'",
    "accelerate; sys_platform != 'darwin'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
